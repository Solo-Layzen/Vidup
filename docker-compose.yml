services:
  app:
    build: .
    restart: unless-stopped
    # Écoute uniquement en local : l'accès public passe par le tunnel
    # Tailscale Funnel (`tailscale funnel 3000`). Pour un accès LAN direct,
    # remplacer par "3000:3000".
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DEEZER_PROXY: ${DEEZER_PROXY:-https://r.jina.ai/}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
      NEXT_TELEMETRY_DISABLED: "1"
    # Cookies YouTube (optionnel) : créer ./cookies.txt puis décommenter.
    # volumes:
    #   - ./cookies.txt:/etc/secrets/cookies.txt:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
